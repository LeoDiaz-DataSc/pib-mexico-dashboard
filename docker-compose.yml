version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: pib_mexico_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pib_mexico_db
    ports:
      - "3306:3306"
    volumes:
      - ./database/baseDedatos_pib_mexico_db.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./database/insert_pib_mexico_db.sql:/docker-entrypoint-initdb.d/2_data.sql

  backend:
    build: 
      context: ./backend
    container_name: inegi_backend
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=pib_mexico_db
      - PORT=3000
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: inegi_frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:3000/api
    depends_on:
      - backend
